  <g id="text_36">
   <text style="font-size: 10.5px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="61.776" y="440.1" transform="rotate(-0 61.776 440.1)">S10 の集計は NH₃・HF と TMA・HF を含む pilot 全体。本資料で紹介する認証経路は NH₃・HF。</text>
  </g>
  <g id="text_37">
   <text style="font-size: 10.5px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="61.776" y="467.1" transform="rotate(-0 61.776 467.1)">report 時点に保存された DiscoveryRecord の分類。DFT 入口の選抜結果を含む。計算失敗は別集計。</text>
  </g>
  <g id="text_38">
   <text style="font-size: 9.5px; font-family: 'Meiryo'; text-anchor: start; fill: #617588" x="61.776" y="493.02" transform="rotate(-0 61.776 493.02)">同じ negative の理由や failure_kind は別の集計。この積上げ棒へ加えない。数の大小だけで探索の汎用性・化学的網羅性を保証しない。</text>
