   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Meiryo'; text-anchor: start; fill: #2a7590" x="92.664" y="143.717876" transform="rotate(-0 92.664 143.717876)">1  候補を作る / 与える</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(92.664 177.896068)">discover: 結合変更から仮説を生成</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(92.664 194.526052)">known_endpoints: 両側の候補を宣言</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(92.664 212.693209)">候補数だけでは反応の証明にならない</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Meiryo'; text-anchor: start; fill: #c37126" x="455.4576" y="143.717876" transform="rotate(-0 455.4576 143.717876)">2  停留性を確認</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(455.4576 178.008427)">極小: 不適切な虚振動がないか</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(455.4576 195.312568)">TS: 虚振動と残る勾配を確認</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(455.4576 212.588021)">電子状態・計算手法の整合を確認</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Meiryo'; text-anchor: start; fill: #75549a" x="818.2512" y="143.717876" transform="rotate(-0 818.2512 143.717876)">3  経路の観測を集める</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(818.2512 177.271318)">TS: 虚モードと QRC の両側接続</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(818.2512 195.248021)">会合: 拘束走査の形状</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(818.2512 212.552959)">端点: 原子対応と極小の照合</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Meiryo'; text-anchor: start; fill: #617588" x="92.664" y="351.285236" transform="rotate(-0 92.664 351.285236)">同じ極小</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(92.664 384.4251)">TMA・(HF)₂</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(92.664 402.915788)">別名の端点が同じ basin に収束</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(92.664 420.117928)">→ 新しい反応の障壁は描かない</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Meiryo'; text-anchor: start; fill: #287664" x="455.4576" y="351.285236" transform="rotate(-0 455.4576 351.285236)">TS を持つ経路</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(455.4576 385.012397)">NH₃ 反転 / NH₃・HF / OH＋CH₄</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(455.4576 402.840881)">停留性と両側接続を満たす</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(455.4576 420.172913)">→ 同じ基準の G で比較</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Meiryo'; text-anchor: start; fill: #a36727" x="818.2512" y="351.285236" transform="rotate(-0 818.2512 351.285236)">TS を採用しない会合</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(818.2512 385.245881)">BH₃＋NH₃</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(818.2512 402.860006)">保存走査では解像度内で障壁なし</text>
    <text style="font-size: 10.2px; font-family: 'Meiryo'; fill: #17334c" transform="translate(818.2512 420.133866)">→ 捕獲律速を別扱い</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="65.988" y="511.25184" transform="rotate(-0 65.988 511.25184)">比較の条件</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="231.3792" y="511.25184" transform="rotate(-0 231.3792 511.25184)">理論・温度・標準状態・分離 / 錯体の基準をそろえる。未達の点は順位に入れない。</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="65.988" y="545.8464" transform="rotate(-0 65.988 545.8464)">次の開発段階</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="231.3792" y="545.8464" transform="rotate(-0 231.3792 545.8464)">異なる出発状態の δG_eff の順位は、初期系の主要生成物・収率・反応速度ではない。</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 22px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="61.776" y="41.184" transform="rotate(-0 61.776 41.184)">反応候補から、何を根拠に判断するか</text>
  </g>
  <g id="text_18">
   <text style="font-size: 13px; font-family: 'Meiryo'; text-anchor: start; fill: #617588" x="61.776" y="72.864" transform="rotate(-0 61.776 72.864)">終了した計算を観測に分け、停留点・接続・比較基準を確認する</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #617588" x="61.776" y="612.6912" transform="rotate(-0 61.776 612.6912)">対応する計算例と観測値: data/data.json  |  現行仕様: docs/design.md  |  将来の反応網・速度評価: docs/improvement-plan.md</text>
  </g>
 </g>
