[project]
name = "hfauto"
version = "0.14.0"
description = "Manifest-based molecular complex, reaction-path, NEB/TS, and thermochemistry workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "HF Auto Project"}]
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "PyYAML>=6.0",
  "rich>=13.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.13"
]

[project.optional-dependencies]
chem = ["rdkit"]
reaction-discovery = [
  "setuptools>=84; platform_system == 'Linux' and python_version >= '3.12' and python_version < '3.13'",
  "scine-readuct==6.1.0; platform_system == 'Linux' and python_version >= '3.12' and python_version < '3.13'",
  "scine-xtb-wrapper==3.0.2; platform_system == 'Linux' and python_version >= '3.12' and python_version < '3.13'",
]
production = [
  "rdkit",
  "pysisyphus>=1.0,<2",
  "numba>=0.66,<1",
  "llvmlite>=0.48,<1",
  "qcengine>=0.50,<1",
  "setuptools>=84; platform_system == 'Linux' and python_version >= '3.12' and python_version < '3.13'",
  "scine-readuct==6.1.0; platform_system == 'Linux' and python_version >= '3.12' and python_version < '3.13'",
  "scine-xtb-wrapper==3.0.2; platform_system == 'Linux' and python_version >= '3.12' and python_version < '3.13'",
  "goodvibes==3.2; platform_system == 'Windows'",
  "goodvibes>=4.3; platform_system != 'Windows'",
]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "types-PyYAML",
  "import-linter",
  "pyrefly",
  "radon",
]

[project.scripts]
hfauto = "hfauto.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hfauto*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# External programs, optional dependencies, and heterogeneous public-data
# parsers are deliberate exception boundaries. They convert arbitrary provider
# failures into typed failure artifacts or best-effort optional output.
ignore = ["BLE001", "S110", "S112"]

[tool.ruff.lint.mccabe]
# Threshold used whenever C901 is selected (e.g. the architecture review run:
# `ruff check --select C90,...`).  C901 is not part of the default rule set.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI metadata through Option/Argument default values by design.
"hfauto/cli/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "golden: runs/ 由来の実出力フィクスチャ",
  "integration: fake エンジンでの結合",
  "real: 実エンジン(WSL、HFAUTO_REAL=1)",
]
pythonpath = ["tests"]
addopts = "-m 'not real' --strict-markers --import-mode=importlib"

# ---------------------------------------------------------------------------
# Architecture contracts (import-linter).  Run from the repository root:
#   lint-imports
# During the refactor only core-is-foundation is kept here; new-module
# contracts live in importlinter-next.toml (Wave 3) and the final contracts
# replace this section in Wave 6 (docs/current/refactor_design.md, 11.1).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["hfauto"]

[[tool.importlinter.contracts]]
id = "core-is-foundation"
name = "hfauto.core imports nothing above it"
type = "forbidden"
source_modules = ["hfauto.core"]
forbidden_modules = [
  "hfauto.chemistry",
  "hfauto.backends",
  "hfauto.stages",
  "hfauto.workflow",
  "hfauto.reporting",
  "hfauto.cli",
]

# ---------------------------------------------------------------------------
# Type checking (pyrefly).  Run from the repository root:  pyrefly check
# python-interpreter-path points at the Windows QA venv; on other machines
# activate the project venv or pass --python-interpreter-path.
# ---------------------------------------------------------------------------
[tool.pyrefly]
project-includes = ["hfauto"]
project-excludes = ["**/__pycache__", "runs", "tests"]
search-path = ["."]
python-version = "3.12"
python-interpreter-path = ".venv-win-qa/Scripts/python.exe"

# ---------------------------------------------------------------------------
# Complexity metrics (radon >= 5.1 reads [tool.radon]).  Example:
#   radon cc -n C hfauto
#   radon mi hfauto
# Notes: radon feeds the whole [tool] table through configparser, so string
# values anywhere under [tool.*] must not contain a bare '%'.  Do not set
# boolean keys (show_complexity, average, ...) to true here: mando then turns
# the matching CLI flags (-s, -a, ...) into "store_false" switches.
# ---------------------------------------------------------------------------
[tool.radon]
exclude = "runs/*"
