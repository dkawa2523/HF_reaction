   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #2a7590" x="37.5066" y="107.426247" transform="rotate(-0 37.5066 107.426247)">1 候補</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(37.5066 133.556192)">discover: 結合変更</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(37.5066 147.94002)">known_endpoints:</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(37.5066 164.164629)">両端を宣言</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(37.5066 179.559551)">候補だけで証明しない</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #c37126" x="191.83842" y="107.426247" transform="rotate(-0 191.83842 107.426247)">2 停留性</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(191.83842 133.534395)">極小と TS の振動</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(191.83842 148.923692)">残る勾配を確認</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(191.83842 164.147051)">計算手法と</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(191.83842 179.471661)">電子状態を確認</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #75549a" x="346.17024" y="107.426247" transform="rotate(-0 346.17024 107.426247)">3 経路の観測</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(346.17024 133.004942)">TS: 虚モード / QRC</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(346.17024 148.866739)">会合: 拘束走査</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(346.17024 164.127364)">端点: 極小の照合</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(346.17024 179.460411)">原子対応を保持</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #617588" x="37.5066" y="266.121447" transform="rotate(-0 37.5066 266.121447)">同じ極小</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(37.5066 291.33522)">TMA・(HF)₂</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(37.5066 307.650533)">宣言端点が合流</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(37.5066 322.828892)">→ 新しい TS 障壁</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(37.5066 338.112017)">を描かない</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #287664" x="191.83842" y="266.121447" transform="rotate(-0 191.83842 266.121447)">TS を認証</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(191.83842 291.853423)">NH₃ 反転 / NH₃・HF</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(191.83842 307.403736)">OH＋CH₄</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(191.83842 322.884439)">停留性と接続を確認</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(191.83842 338.218892)">→ 同じ条件の G</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #a36727" x="346.17024" y="266.121447" transform="rotate(-0 346.17024 266.121447)">TS を採用しない</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(346.17024 292.059439)">BH₃＋NH₃</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(346.17024 307.575298)">走査の分解能内で</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(346.17024 322.828892)">障壁なし</text>
    <text style="font-size: 9px; font-family: 'Meiryo'; fill: #17334c" transform="translate(346.17024 338.142954)">→ 捕獲律速を別扱い</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="25.9893" y="390.46608" transform="rotate(-0 25.9893 390.46608)">理論・温度・標準状態・分離/錯体の基準をそろえる。</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Meiryo'; text-anchor: start; fill: #17334c" x="26.532" y="22.573086" transform="rotate(-0 26.532 22.573086)">反応候補から、何を根拠に判断するか</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #617588" x="26.532" y="36.6048" transform="rotate(-0 26.532 36.6048)">候補・停留点・接続・比較基準を分けて確認する。</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'Meiryo'; text-anchor: start; fill: #617588" x="26.532" y="428.544" transform="rotate(-0 26.532 428.544)">計算終了・科学的認証・生成物比の予測は、それぞれ異なる判断。</text>
  </g>
 </g>
