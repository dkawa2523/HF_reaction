scheduler: slurm
schedulers: [slurm, pbs, lsf]
project_root: "$PWD"
array_chunk: 4
autotune_safety_factor: 1.25
artifact_job_mode: heavy
artifact_job_rules:
  species:
    stage: preopt
    enabled: true
    priority: 45
    reuse_policy: review_required
  species_preopt:
    stage: dft-minima
    enabled: true
    priority: 80
    method_hint: r2scan3c_orca
    reuse_policy: review_required
  species_optimized:
    stage: sp
    enabled: true
    priority: 75
    method_hint: wb97xd4_def2_tzvppd_orca
  reaction:
    stage: ts-search
    enabled: true
    priority: 90
  reaction_validated:
    stage: irc
    enabled: true
    priority: 85
resource_profile:
  array_chunk: 4
  stages:
    preopt:
      ncores: 4
      memory_gb: 8
      time_min: 240
      queue: medium
    dft-minima:
      ncores: 16
      memory_gb: 32
      time_min: 1440
      queue: long
    ts-search:
      ncores: 24
      memory_gb: 64
      time_min: 2880
      queue: long
    irc:
      ncores: 16
      memory_gb: 48
      time_min: 1440
      queue: long
    sp:
      ncores: 16
      memory_gb: 64
      time_min: 720
      queue: long
qcarchive_allow_submit: false
