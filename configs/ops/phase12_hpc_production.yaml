scheduler: slurm
schedulers: [slurm, pbs, lsf, local]
project_root: "$PWD"
array_stages: [preopt, dft-minima, ts-search, irc, sp]
qcarchive_dataset: hfauto_hf_reactivity_production
resource_profile:
  array_chunk: 1
  stages:
    preopt:
      ncores: 4
      memory_gb: 8
      time_min: 240
      queue: medium
    dft-minima:
      ncores: 16
      memory_gb: 32
      time_min: 1440
      queue: long
    ts-search:
      ncores: 32
      memory_gb: 64
      time_min: 2880
      queue: long
    irc:
      ncores: 16
      memory_gb: 48
      time_min: 1440
      queue: long
    sp:
      ncores: 16
      memory_gb: 64
      time_min: 720
      queue: long
