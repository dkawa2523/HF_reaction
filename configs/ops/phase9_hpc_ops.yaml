# Phase 9 operations planning config. Does not launch jobs.
plan_stages:
  - conformers
  - preopt
  - dft-minima
  - ts-search
  - irc
  - sp
  - thermo
  - kinetics
  - calibrate
  - viz
max_jobs_per_stage: 200
priority_base: 100
resource_profiles:
  conformers:
    backend: crest
    threads: 8
    memory_gb: 8
    walltime: "04:00:00"
    queue: short
  preopt:
    backend: xtb
    threads: 4
    memory_gb: 4
    walltime: "01:00:00"
    queue: short
  dft-minima:
    backend: orca
    threads: 16
    memory_gb: 32
    walltime: "12:00:00"
    queue: medium
  ts-search:
    backend: orca_nebts
    threads: 24
    memory_gb: 64
    walltime: "24:00:00"
    queue: long
  irc:
    backend: orca
    threads: 16
    memory_gb: 32
    walltime: "12:00:00"
    queue: medium
  sp:
    backend: orca
    threads: 24
    memory_gb: 48
    walltime: "08:00:00"
    queue: medium
scheduler:
  max_parallel_jobs: 50
retry_policy:
  ts_search_failed:
    stage: ts-search
    priority: 95
    max_retries: 2
    action: try_scan_optts_then_pysisyphus
