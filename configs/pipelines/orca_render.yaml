# Renders ORCA inputs for review. It will not execute ORCA unless HFAUTO_USE_REAL_ORCA=1 is set.
run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers: [dummy]
  - name: detect-sites
    enabled: true
  - name: conformers
    enabled: true
    engine: rdkit
    max_conformers: 3
  - name: build-hf
    enabled: true
    hf_n: [1, 2]
  - name: dft-minima
    enabled: true
    engine: orca
    method: r2SCAN-3c
    settings:
      orca_keywords: ["r2SCAN-3c", "Opt", "Freq", "TightSCF", "TightOpt"]
      ncores: 8
