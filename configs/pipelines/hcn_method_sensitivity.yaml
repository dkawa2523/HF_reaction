pipeline_id: hcn_stationary_point_method_sensitivity_v1
run_root: runs

global:
  mode: production
  temperature_K: [298.15]

stages:
  # Fixed-geometry single points quantify electronic-energy sensitivity only.
  # They do not claim that the structures are stationary on the alternative PES.
  - name: sp
    engine: nwchem
    method: pbe0_d3_def2_svpd_fixed_geometry
    states: [candidate, product_candidate, transition_state]
    include_validated_transition_states: true
    settings: &sp_method
      allow_subprocess: true
      fallback_to_dummy: false
      functional: pbe0
      basis: def2-svpd
      disp_vdw: 3
      required_program_version: 7.2.3
      grid: xfine
      scf_energy_tolerance: 1.0e-8
      # HCN/HNC has only three atoms; one rank avoids competing with the
      # concurrent 17-atom TMA(HF)2 path job without changing the PES.
      ncores: 1
      memory_mb: 1000
      timeout_s: 3600
      executable: /home/user/.local/bin/nwchem
      mpi_executable: /home/user/.local/opt/nwchem-7.2.3/bin/mpirun

  - name: sp
    engine: nwchem
    method: pbe0_d3_def2_tzvpd_fixed_geometry
    states: [candidate, product_candidate, transition_state]
    include_validated_transition_states: true
    settings:
      <<: *sp_method
      basis: def2-tzvpd

  - name: sp
    engine: nwchem
    method: b3lyp_d3_def2_tzvpd_fixed_geometry
    states: [candidate, product_candidate, transition_state]
    include_validated_transition_states: true
    settings:
      <<: *sp_method
      functional: b3lyp
      basis: def2-tzvpd

  - name: method-panel
    require_real_qm: true
    minimum_complete_methods: 3
    reference_method_id: pbe0_d3_def2_svpd_fixed_geometry
    method_ids:
      - pbe0_d3_def2_svpd_fixed_geometry
      - pbe0_d3_def2_tzvpd_fixed_geometry
      - b3lyp_d3_def2_tzvpd_fixed_geometry

  - name: reaction-rank
    metric: delta_G_activation_standard_kcal_mol
    objective: lower
    evidence_policy: production
    uncertainty_policy: conservative_bound
    population_policy: report_only
