pipeline_id: amine_hf_pilot_hf1_hf3_v1
run_root: runs

input:
  sdf: examples/production/amine_hf_pilot.sdf

global:
  mode: production
  temperature_K: [298.15]

stages:
  - name: ingest

  - name: enumerate-states
    include_tautomers: false
    include_protomers: false
    max_states_per_molecule: 1

  - name: conformers
    engine: crest
    allow_subprocess: true
    fallback_to_rdkit: false
    executable: /home/user/.local/bin/crest
    xtb_executable: /home/user/.local/bin/xtb
    quick: true
    gfn: 2
    threads: 1
    max_conformers: 2
    selected_max: 1
    energy_window_kcal_mol: 4.0
    timeout_s: 7200

  - name: build-complexes
    # Definition-level checkpoints make the bounded CREST campaign resumable.
    # Reuse requires an exact request fingerprint; failed definitions are
    # retried in a fresh raw attempt folder.
    checkpoint_each_definition: true
    resume_completed_definitions: true
    systems:
      - system_id: hf
        state: isolated_candidate
        xyz_path: examples/reaction_discovery/hf.xyz
        charge: 0
        multiplicity: 1
      - system_id: water
        state: isolated_candidate
        xyz_path: examples/reaction_discovery/water.xyz
        charge: 0
        multiplicity: 1

    max_components: 5
    crest_nci_settings:
      allow_subprocess: true
      executable: /home/user/.local/bin/crest
      xtb_executable: /home/user/.local/bin/xtb
      quick: true
      gfn: 2
      threads: 1
      timeout_s: 7200
      energy_window_kcal_mol: 4.0
    compositions:
      # The pilot SDF order is NH3, TMA, aniline, pyridine. State/conformer
      # ids are deterministic because enumeration and conformer selection are
      # each bounded to one record.
      - &nh3_hf1
        composition_id: NH3_HF1
        state: encounter_complex
        max_seeds: 1
        max_nci_complexes: 1
        components:
          - selector: {artifact_id: mol00000_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            role: acid
      - <<: *nh3_hf1
        composition_id: NH3_HF2
        components:
          - selector: {artifact_id: mol00000_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 2
            role: acid
      - <<: *nh3_hf1
        composition_id: NH3_HF3
        components:
          - selector: {artifact_id: mol00000_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 3
            role: acid

      - &tma_hf1
        <<: *nh3_hf1
        composition_id: TMA_HF1
        components:
          - selector: {artifact_id: mol00001_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            role: acid
      - <<: *tma_hf1
        composition_id: TMA_HF2
        components:
          - selector: {artifact_id: mol00001_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 2
            role: acid
      - <<: *tma_hf1
        composition_id: TMA_HF3
        components:
          - selector: {artifact_id: mol00001_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 3
            role: acid

      - &anl_hf1
        <<: *nh3_hf1
        composition_id: ANL_HF1
        components:
          - selector: {artifact_id: mol00002_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            role: acid
      - <<: *anl_hf1
        composition_id: ANL_HF2
        components:
          - selector: {artifact_id: mol00002_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 2
            role: acid
      - <<: *anl_hf1
        composition_id: ANL_HF3
        components:
          - selector: {artifact_id: mol00002_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 3
            role: acid

      - &pyr_hf1
        <<: *nh3_hf1
        composition_id: PYR_HF1
        components:
          - selector: {artifact_id: mol00003_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            role: acid
      - <<: *pyr_hf1
        composition_id: PYR_HF2
        components:
          - selector: {artifact_id: mol00003_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 2
            role: acid
      - <<: *pyr_hf1
        composition_id: PYR_HF3
        components:
          - selector: {artifact_id: mol00003_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 3
            role: acid

      # Representative microsolvation series. Water remains an explicit
      # molecular component; no continuum or wet-etch equipment physics is
      # implied. TMA spans HF1/HF2/HF3 to expose one- and two-step relays.
      - <<: *tma_hf1
        composition_id: TMA_HF1_H2O
        components:
          - selector: {artifact_id: mol00001_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            role: acid
          - selector: {artifact_id: spc_water}
            role: relay
      - <<: *tma_hf1
        composition_id: TMA_HF2_H2O
        components:
          - selector: {artifact_id: mol00001_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 2
            role: acid
          - selector: {artifact_id: spc_water}
            role: relay
      - <<: *tma_hf1
        composition_id: TMA_HF3_H2O
        components:
          - selector: {artifact_id: mol00001_state000_conf0000}
            role: base
          - selector: {artifact_id: spc_hf}
            count: 3
            role: acid
          - selector: {artifact_id: spc_water}
            role: relay

  - name: preopt
    engine: xtb
    method: gfn2-xtb
    states: [encounter_complex]
    required_source_data_keys: [crest_nci_conformer_id]
    update_species: true
    require_real_qm: true
    require_connectivity_retention: true
    checkpoint_each_job: true
    resume_completed_jobs: true
    settings:
      allow_subprocess: true
      executable: /home/user/.local/bin/xtb
      fallback_to_dummy: false
      gfn: 2
      opt_level: tight

  - name: relaxation-discovery
    include_crest_topology_stops: true

  - name: generate-reactions
    states: [encounter_complex]
    required_source_data_keys: [crest_nci_conformer_id]
    automatic: true
    max_relay_steps: 2
    max_attempts_per_trial: 2
    max_trials_per_species: 2
    max_total_trials: 30
    driver_order: [nt2, afir]

  - name: explore-reactions
    engine: readuct
    stop_after_first_candidate: true
    max_total_attempts: 60
    max_stage_walltime_s: 14400
    checkpoint_each_attempt: true
    resume_completed_attempts: true
    settings:
      method_family: GFN2
      nt_max_iterations: 200
      afir_max_iterations: 200
      afir_energy_allowance_kj_mol: 300.0
      ts_max_iterations: 200
      irc_max_iterations: 150
      endpoint_max_iterations: 200

  - name: discovery-audit
