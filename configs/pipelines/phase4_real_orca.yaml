# Phase 4 production-style ORCA pipeline.
# Requires ORCA on PATH or an explicit executable path. Execution is opt-in here.
# Set fallback_to_dummy=false for production so missing/failed ORCA is visible.
run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15, 473.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001
  max_conformers_per_molecule: 5
  max_sites_per_molecule: 5

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers: [dummy]
  - name: detect-sites
    enabled: true
    max_sites_per_molecule: 5
  - name: conformers
    enabled: true
    engine: crest
    allow_subprocess: true
    fallback_to_rdkit: true
    executable: crest
    gfn: 2
    ncores: 8
    selected_max: 5
    max_conformers: 20
    timeout_s: 86400
  - name: build-hf
    enabled: true
    hf_n: [1, 2, 3]
  - name: preopt
    enabled: true
    engine: xtb
    method: gfn2-xtb
    allow_subprocess: true
    settings:
      executable: xtb
      gfn: 2
      opt_level: tight
      timeout_s: 7200
  - name: dft-minima
    enabled: true
    engine: orca
    method: r2scan3c_orca
    settings:
      executable: orca
      allow_subprocess: true
      fallback_to_dummy: false
      ncores: 16
      memory_mb: 4000
      timeout_s: 86400
      orca_keywords: ["r2SCAN-3c", "TightSCF", "TightOpt"]
  - name: sp
    enabled: true
    engine: orca
    method: wb97xd4_def2_tzvppd_orca
    settings:
      executable: orca
      allow_subprocess: true
      fallback_to_dummy: false
      ncores: 16
      memory_mb: 4000
      timeout_s: 86400
      orca_keywords: ["wB97X-D4", "def2-TZVPPD", "TightSCF", "Grid5", "FinalGrid6"]
  - name: thermo
    enabled: true
    engine: orca_dft_sp
  - name: descriptors
    enabled: true
  - name: rank
    enabled: true
