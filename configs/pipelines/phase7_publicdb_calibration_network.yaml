# Phase 7 production-style public DB enrichment.
# Requires network permission and, for CompTox CTX, an EPA_CTX_API_KEY environment variable.
run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15, 473.15, 523.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers:
      - name: pubchem
        network_enabled: true
        rate_limit_per_sec: 4
        fetch_3d: true
        fetch_synonyms: true
      - name: nist_webbook
        network_enabled: true
        rate_limit_per_sec: 1
        use_builtin_references: true
      - name: atct
      - name: cccbdb
      - name: comptox
        network_enabled: true
        api_key_env: EPA_CTX_API_KEY
      - name: niosh
  - name: detect-sites
    enabled: true
  - name: conformers
    enabled: true
    engine: crest
    allow_subprocess: true
    fallback_to_rdkit: true
  - name: build-hf
    enabled: true
    hf_n: [1, 2, 3]
  - name: preopt
    enabled: true
    engine: xtb
    method: gfn2-xtb
    allow_subprocess: true
    settings:
      executable: xtb
      gfn: 2
      opt_level: tight
  - name: dft-minima
    enabled: true
    engine: orca
    method: r2scan3c_orca
    settings:
      executable: orca
      allow_subprocess: true
      fallback_to_dummy: false
  - name: thermo
    enabled: true
    engine: goodvibes
  - name: descriptors
    enabled: true
  - name: calibrate
    enabled: true
  - name: rank
    enabled: true
