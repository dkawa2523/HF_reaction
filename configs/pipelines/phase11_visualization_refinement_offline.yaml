pipeline_id: phase11_visualization_refinement_offline
input:
  sdf: examples/candidates.sdf
run_root: runs
global:
  temperature_K: [298.15, 423.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001
stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers:
      - name: dummy
  - name: detect-sites
    enabled: true
  - name: conformers
    enabled: true
    engine: rdkit
    max_conformers_per_molecule: 1
  - name: build-hf
    enabled: true
    hf_n: [1, 2]
  - name: preopt
    enabled: true
    engine: dummy
  - name: dft-minima
    enabled: true
    engine: dummy
  - name: ts-search
    enabled: true
    engine_order:
      - engine: dummy
  - name: irc
    enabled: true
    engine: dummy
  - name: sp
    enabled: true
    engine: dummy
  - name: thermo
    enabled: true
    engine: goodvibes
    settings:
      apply_internal_quasi_rrho: true
      use_external_goodvibes: false
      allow_subprocess: false
  - name: kinetics
    enabled: true
    engine: tst
    tunneling_model: wigner
    cantera:
      allow_external: false
      run_reactor: false
    arkane:
      run_external: false
      allow_subprocess: false
    write_arkane_skeleton: true
  - name: calibrate
    enabled: true
    reference_set: examples/reference_sets/hf_amine_gas_phase_demo.json
  - name: connector-audit
    enabled: true
  - name: rank
    enabled: true
  - name: viz
    enabled: true
    settings:
      max_molecule_dossiers: 3
      max_reaction_dossiers: 3
      top_energy_profiles: 4
      max_network_reactions: 8
      library_mode: local
      asset_mode: local
      ranking_thumbnail_rows: 20
  - name: ops
    enabled: true
    pipeline_config: configs/pipelines/phase11_visualization_refinement_offline.yaml
    settings:
      scheduler: slurm
      project_root: "$PWD"
