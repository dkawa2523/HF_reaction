pipeline_id: hcn_numerical_sensitivity_v1
run_root: runs

global:
  mode: production
  temperature_K: [298.15]
  standard_pressure_bar: 1.0

stages:
  # Reuse the validated PBE0-D3/def2-SVPD geometries. Both integration grids
  # are executed here so the numerical comparison is self-contained.
  - name: sp
    engine: nwchem
    method: pbe0_d3_def2_svpd_grid_xfine
    states: [candidate, product_candidate, transition_state]
    include_validated_transition_states: true
    settings: &grid_sp
      allow_subprocess: true
      fallback_to_dummy: false
      functional: pbe0
      basis: def2-svpd
      disp_vdw: 3
      required_program_version: 7.2.3
      grid: xfine
      scf_energy_tolerance: 1.0e-8
      ncores: 1
      memory_mb: 1000
      timeout_s: 3600
      executable: /home/user/.local/bin/nwchem
      mpi_executable: /home/user/.local/opt/nwchem-7.2.3/bin/mpirun

  - name: sp
    engine: nwchem
    method: pbe0_d3_def2_svpd_grid_fine
    states: [candidate, product_candidate, transition_state]
    include_validated_transition_states: true
    settings:
      <<: *grid_sp
      grid: fine

  - name: method-panel
    require_real_qm: true
    minimum_complete_methods: 2
    reference_method_id: pbe0_d3_def2_svpd_grid_xfine
    method_ids:
      - pbe0_d3_def2_svpd_grid_xfine
      - pbe0_d3_def2_svpd_grid_fine

  - name: thermo-sensitivity
    cutoffs_cm1: [50, 100, 150]
    temperature_K: 298.15
    frequency_scale_factor: 0.985
    settings:
      executable: /mnt/c/Users/user/Desktop/HF_reaction/hfauto_final_baseline/.venv/bin/goodvibes
      timeout_s: 1200
