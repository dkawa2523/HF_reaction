pipeline_id: same_basin_water_nwchem_v1
run_root: runs

global:
  mode: production
  temperature_K: [298.15]
  standard_pressure_bar: 1.0

stages:
  - name: build-complexes
    systems:
      - system_id: water_reference
        state: minimum_candidate
        xyz_path: examples/same_basin_water/reference.xyz
        charge: 0
        multiplicity: 1
        atom_order_key: O_H1_H2
      - system_id: water_distorted
        state: minimum_candidate
        xyz_path: examples/same_basin_water/distorted.xyz
        charge: 0
        multiplicity: 1
        atom_order_key: O_H1_H2

  - name: dft-minima
    engine: nwchem
    method: pbe0_def2_svpd_same_basin_water
    states: [minimum_candidate]
    require_real_qm: true
    update_species: true
    checkpoint_each_job: true
    resume_completed_jobs: true
    settings:
      allow_subprocess: true
      fallback_to_dummy: false
      functional: pbe0
      basis: def2-svpd
      disp_vdw: 3
      required_program_version: 7.2.3
      grid: xfine
      scf_energy_tolerance: 1.0e-8
      optimization_convergence: tight
      geometry_maxiter: 150
      ncores: 1
      memory_mb: 1000
      timeout_s: 7200
      executable: /home/user/.local/bin/nwchem
      mpi_executable: /home/user/.local/opt/nwchem-7.2.3/bin/mpirun

  - name: minimum-registry
    require_real_qm: true
    same_basin_distance_rmsd_A: 0.02
    distinct_basin_distance_rmsd_A: 0.05
    same_basin_energy_tolerance_hartree: 0.00001
