pipeline_id: tma_hf2_reaction_discovery_nwchem_v4
run_root: runs

global:
  mode: production
  temperature_K: [298.15]
  standard_pressure_bar: 1.0

stages:
  - name: build-complexes
    systems:
      - system_id: tma
        state: isolated_candidate
        xyz_path: examples/reaction_discovery/tma.xyz
        charge: 0
        multiplicity: 1
      - system_id: hf
        state: isolated_candidate
        xyz_path: examples/reaction_discovery/hf.xyz
        charge: 0
        multiplicity: 1

    max_components: 3
    crest_nci_settings:
      allow_subprocess: true
      executable: /home/user/.local/bin/crest
      xtb_executable: /home/user/.local/bin/xtb
      quick: true
      gfn: 2
      threads: 4
      timeout_s: 14400
      energy_window_kcal_mol: 6.0
    compositions:
      - composition_id: tma_hf2
        state: encounter_complex
        charge: 0
        multiplicity: 1
        max_seeds: 4
        max_nci_complexes: 4
        seed_distances_A: [1.65, 1.90]
        components:
          - selector: {artifact_id: spc_tma}
            count: 1
            role: base
          - selector: {artifact_id: spc_hf}
            count: 2
            role: acid

  - name: preopt
    engine: xtb
    method: gfn2-xtb
    states: [encounter_complex]
    required_source_data_keys: [crest_nci_conformer_id]
    update_species: true
    require_real_qm: true
    require_connectivity_retention: true
    checkpoint_each_job: true
    resume_completed_jobs: true
    settings:
      allow_subprocess: true
      executable: /home/user/.local/bin/xtb
      fallback_to_dummy: false
      gfn: 2
      opt_level: tight

  - name: relaxation-discovery
    include_crest_topology_stops: true

  - name: generate-reactions
    states: [encounter_complex]
    # Explore the CREST NCI ensemble itself, not its pre-CREST placement seed.
    required_source_data_keys: [crest_nci_conformer_id]
    automatic: true
    max_relay_steps: 2
    max_attempts_per_trial: 2
    max_trials_per_species: 12
    max_total_trials: 12
    driver_order: [nt2, afir]

  - name: explore-reactions
    engine: readuct
    stop_after_first_candidate: true
    max_total_attempts: 24
    settings:
      method_family: GFN2
      nt_max_iterations: 250
      afir_max_iterations: 250
      afir_energy_allowance_kj_mol: 300.0
      ts_max_iterations: 250
      irc_max_iterations: 200
      endpoint_max_iterations: 250

  - name: dft-minima
    engine: nwchem
    method: pbe0_def2_svpd_tma_hf2_minimum
    states: [encounter_complex, product_candidate]
    # Select three low-level products and each exact trial-source conformer.
    # Endpoint lineage therefore remains resolvable in minimum-registry.
    candidate_endpoint_limit: 3
    candidate_duplicate_rmsd_A: 0.05
    # Retain a small DFT anchor ensemble even when xTB finds no product.
    # Low-level and DFT surfaces can contain different minimum basins.
    anchor_minima_per_state:
      encounter_complex: 4
    require_real_qm: true
    update_species: true
    settings: &dft_method
      allow_subprocess: true
      fallback_to_dummy: false
      functional: pbe0
      basis: def2-svpd
      disp_vdw: 3
      required_program_version: 7.2.3
      grid: xfine
      scf_energy_tolerance: 1.0e-8
      # Weak NCI translation/rotation modes make ``driver tight`` chase grid
      # noise.  Use NWChem's standard stationary-point threshold and retain
      # the complete n_imag=0 Hessian as the minimum acceptance gate.
      optimization_convergence: default
      geometry_maxiter: 80
      ncores: 4
      memory_mb: 4000
      timeout_s: 14400
      executable: /home/user/.local/bin/nwchem
      mpi_executable: /home/user/.local/opt/nwchem-7.2.3/bin/mpirun

  - name: minimum-registry
    require_real_qm: true
    same_basin_distance_rmsd_A: 0.02
    distinct_basin_distance_rmsd_A: 0.05
    same_basin_energy_tolerance_hartree: 0.00001

  - name: connect-minima
    max_connections: 12

  - name: reaction-plan
    max_path_attempts: 3

  - name: ts-search
    engine_order: [nwchem_neb, nwchem_string, nwchem_saddle]
    method: pbe0_def2_svpd_tma_hf2_path
    require_validated_dft_minima: true
    require_reaction_case: true
    settings:
      <<: *dft_method
      nbeads: 9
      neb_maxiter: 150
      string_nbeads: 9
      string_maxiter: 180
      saddle_initial_hessian: true
      allow_interrupted_path_seed: true
      ts_mode_overlap_threshold: 0.50
      ts_opt_threshold: gau_tight

  - name: irc
    engine: pysisyphus
    method: pbe0_def2_svpd_tma_hf2_irc
    require_reaction_case: true
    settings:
      <<: *dft_method
      program: nwchem
      pysis_executable: /mnt/c/Users/user/Desktop/HF_reaction/hfauto_final_baseline/.venv/bin/pysis
      irc_integrator: eulerpc
      irc_maxiter: 150
      optimize_irc_endpoints: true
      require_optimized_irc_endpoints: true
      endpoint_optimizer: nwchem

  - name: reaction-classify
    require_real_qm: true

  - name: thermo
    engine: goodvibes
    settings:
      use_external_goodvibes: true
      allow_subprocess: true
      prefer_external_goodvibes_g: true
      apply_internal_quasi_rrho: false
      quasi_rrho_cutoff_cm1: 100.0
      frequency_scale_factor: 0.985
      extra_args: [-q, -f, "100", -v, "0.985", --temp, "298.15", --csv, Goodvibes.csv]

  - name: basin-populations
    require_production_thermo: true

  - name: reaction-rank
    metric: delta_G_activation_standard_kcal_mol
    objective: lower
    evidence_policy: production

  - name: discovery-audit
