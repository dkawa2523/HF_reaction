# Phase 6 offline/review pipeline.
# External QM/TS tools are not executed; fallback artifacts keep the data contract
# testable.  Thermo/kinetics stages perform internal quasi-RRHO/TST/Cantera
# skeleton generation so outputs are process-review ready.
run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15, 473.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001
    # complex omitted: complex/TS/IP are evaluated at standard-state unless specified
  max_conformers_per_molecule: 4
  max_sites_per_molecule: 5

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers: [dummy]
  - name: detect-sites
    enabled: true
    max_sites_per_molecule: 5
  - name: conformers
    enabled: true
    engine: crest
    allow_subprocess: false
    fallback_to_rdkit: true
    max_conformers: 8
    selected_max: 3
    energy_window_kcal_mol: 8.0
    prune_rms_thresh: 0.5
  - name: build-hf
    enabled: true
    hf_n: [1, 2]
  - name: preopt
    enabled: true
    engine: xtb
    method: gfn2-xtb
    allow_subprocess: false
    settings:
      gfn: 2
      opt_level: normal
  - name: dft-minima
    enabled: true
    engine: orca
    method: r2scan3c_orca
    settings:
      allow_subprocess: false
      fallback_to_dummy: true
      ncores: 4
      memory_mb: 2000
      orca_keywords: ["r2SCAN-3c", "TightSCF", "TightOpt"]
  - name: ts-search
    enabled: true
    engine_order:
      - engine: orca_nebts
        allow_subprocess: false
        fallback_to_dummy: true
        ncores: 4
        memory_mb: 2000
        method_id: r2scan3c_orca_nebts
        orca_keywords: ["r2SCAN-3c", "TightSCF"]
        nimages: 6
    settings:
      fallback_to_dummy: true
      freq: true
      mode_overlap_override: 0.8
  - name: irc
    enabled: true
    engine: orca_nebts
    method: r2scan3c_orca_irc
    settings:
      allow_subprocess: false
      fallback_to_dummy: true
      ncores: 4
      memory_mb: 2000
      irc_maxiter: 60
      endpoint_rmsd_threshold_A: 0.75
  - name: sp
    enabled: true
    engine: orca
    method: wb97xd4_def2_tzvppd_orca
    settings:
      allow_subprocess: false
      fallback_to_dummy: true
      ncores: 4
      memory_mb: 3000
      orca_keywords: ["wB97X-D4", "def2-TZVPPD", "TightSCF", "Grid5", "FinalGrid6"]
  - name: thermo
    enabled: true
    engine: goodvibes
    settings:
      apply_quasi_rrho: true
      frequency_scale_factor: 0.985
      low_freq_cutoff_cm1: 100.0
      quasi_rrho_alpha: 0.50
      thermo_model: internal_goodvibes_compatible_quasi_rrho
  - name: descriptors
    enabled: true
  - name: kinetics
    enabled: true
    engine: cantera
    tunneling_model: wigner
    export_arkane: true
    settings:
      residence_times_s: [0.001, 0.01, 0.1, 1.0]
  - name: rank
    enabled: true
