pipeline_id: phase9_hpc_template
input:
  sdf: examples/candidates.sdf
run_root: runs
global:
  temperature_K: [298.15, 423.15]
  standard_pressure_bar: 1.0
  partial_pressures: {HF: 0.01, candidate: 0.001}
stages:
  - {name: ingest, enabled: true}
  - {name: enrich, enabled: true, providers: [{name: dummy}]}
  - {name: detect-sites, enabled: true}
  - {name: conformers, enabled: true, engine: crest, fallback_engine: rdkit}
  - {name: build-hf, enabled: true, hf_n: [1, 2, 3]}
  - {name: preopt, enabled: true, engine: xtb, engine_settings: {fallback_to_dummy: true}}
  - {name: dft-minima, enabled: true, engine: orca, engine_settings: {fallback_to_dummy: true}}
  - {name: ts-search, enabled: true, engine_order: [{engine: orca_nebts, fallback_to_dummy: true}]}
  - {name: irc, enabled: true, engine: orca_nebts, engine_settings: {fallback_to_dummy: true}}
  - {name: sp, enabled: true, engine: orca, engine_settings: {fallback_to_dummy: true}}
  - {name: thermo, enabled: true}
  - {name: descriptors, enabled: true}
  - {name: kinetics, enabled: true}
  - {name: calibrate, enabled: true}
  - {name: rank, enabled: true}
  - {name: viz, enabled: false}
