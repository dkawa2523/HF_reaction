pipeline_id: formaldehyde_hydroxymethylene_nwchem_v1
run_root: runs

global:
  mode: production
  temperature_K: [298.15]
  standard_pressure_bar: 1.0

stages:
  - name: build-complexes
    systems:
      - system_id: formaldehyde
        state: reactant
        xyz_path: examples/m3_formaldehyde_hydroxymethylene/formaldehyde.xyz
        charge: 0
        multiplicity: 1
        atom_order_key: C_O_Hm_Hs
      - system_id: trans_hydroxymethylene
        state: product
        xyz_path: examples/m3_formaldehyde_hydroxymethylene/trans_hydroxymethylene.xyz
        charge: 0
        multiplicity: 1
        atom_order_key: C_O_Hm_Hs

  - name: generate-reactions
    states: [reactant]
    automatic: false
    max_trials_per_species: 1
    max_total_trials: 1
    driver_order: [dft_minimum_ensemble]
    explicit_trials:
      - system_id: formaldehyde
        mechanism_hint: intramolecular_hydrogen_migration
        associations: [[1, 2]]
        dissociations: [[0, 2]]
        driver_order: [dft_minimum_ensemble]

  - name: dft-minima
    engine: nwchem
    method: pbe0_d3_def2_svpd_h2co_hcoh_minimum
    states: [reactant, product]
    require_real_qm: true
    update_species: true
    checkpoint_each_job: true
    resume_completed_jobs: true
    settings: &method
      allow_subprocess: true
      fallback_to_dummy: false
      functional: pbe0
      basis: def2-svpd
      disp_vdw: 3
      required_program_version: 7.2.3
      grid: xfine
      scf_energy_tolerance: 1.0e-8
      optimization_convergence: tight
      geometry_maxiter: 180
      ncores: 1
      memory_mb: 1200
      timeout_s: 14400
      executable: /home/user/.local/bin/nwchem
      mpi_executable: /home/user/.local/opt/nwchem-7.2.3/bin/mpirun

  - name: minimum-registry
    require_real_qm: true
    same_basin_distance_rmsd_A: 0.02
    distinct_basin_distance_rmsd_A: 0.05
    same_basin_energy_tolerance_hartree: 0.00001

  - name: connect-minima
    max_connections: 1

  - name: reaction-plan
    max_path_attempts: 4

  - name: ts-search
    engine_order: [nwchem_neb, nwchem_string, nwchem_saddle]
    method: pbe0_d3_def2_svpd_h2co_hcoh_path
    require_validated_dft_minima: true
    require_reaction_case: true
    checkpoint_each_attempt: true
    resume_completed_reactions: true
    max_reactions: 1
    max_total_attempts: 4
    max_stage_walltime_s: 14400
    settings:
      <<: *method
      nbeads: 9
      neb_maxiter: 150
      string_nbeads: 9
      string_maxiter: 150
      saddle_initial_hessian: true
      allow_interrupted_path_seed: true
      ts_mode_overlap_threshold: 0.50
      ts_opt_threshold: gau_tight

  - name: irc
    engine: pysisyphus
    method: pbe0_d3_def2_svpd_h2co_hcoh_irc
    require_reaction_case: true
    settings:
      <<: *method
      program: nwchem
      pysis_executable: /mnt/c/Users/user/Desktop/HF_reaction/hfauto_final_baseline/.venv/bin/pysis
      irc_integrator: eulerpc
      irc_maxiter: 180
      optimize_irc_endpoints: true
      require_optimized_irc_endpoints: true
      endpoint_optimizer: nwchem

  - name: reaction-classify
    require_real_qm: true

  - name: thermo
    engine: goodvibes
    settings:
      use_external_goodvibes: true
      allow_subprocess: true
      prefer_external_goodvibes_g: true
      apply_internal_quasi_rrho: false
      quasi_rrho_cutoff_cm1: 100.0
      frequency_scale_factor: 0.985
      extra_args: [-q, -f, "100", -v, "0.985", --temp, "298.15", --csv, Goodvibes.csv]

  - name: basin-populations
    require_production_thermo: true

  - name: reaction-rank
    metric: delta_G_activation_standard_kcal_mol
    objective: lower
    evidence_policy: production

  - name: discovery-audit
