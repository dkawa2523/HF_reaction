run_root: runs
input:
  sdf: examples/candidates.sdf
global:
  temperature_K:
  - 298.15
  - 423.15
  - 473.15
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001
  max_conformers_per_molecule: 4
  max_sites_per_molecule: 5
stages:
- name: ingest
  enabled: true
- name: enrich
  enabled: true
  providers:
  - dummy
  - name: pubchem
    network_enabled: false
    fetch_3d: true
    fetch_synonyms: true
  - name: nist_webbook
    network_enabled: false
    use_builtin_references: true
  - name: atct
  - name: cccbdb
  - name: comptox
    network_enabled: false
  - name: niosh
  - name: cas_common_chemistry
- name: detect-sites
  enabled: true
  max_sites_per_molecule: 5
- name: conformers
  enabled: true
  engine: crest
  allow_subprocess: false
  fallback_to_rdkit: true
  max_conformers: 8
  selected_max: 3
  energy_window_kcal_mol: 8.0
  prune_rms_thresh: 0.5
- name: build-hf
  enabled: true
  hf_n:
  - 1
  - 2
- name: preopt
  enabled: true
  engine: xtb
  method: gfn2-xtb
  allow_subprocess: false
  settings:
    gfn: 2
    opt_level: normal
- name: dft-minima
  enabled: true
  engine: orca
  method: r2scan3c_orca
  settings:
    allow_subprocess: false
    fallback_to_dummy: true
    ncores: 4
    memory_mb: 2000
    orca_keywords:
    - r2SCAN-3c
    - TightSCF
    - TightOpt
- name: ts-search
  enabled: true
  engine: orca_nebts
  method: r2scan3c_orca_nebts
  settings:
    allow_subprocess: false
    fallback_to_dummy: true
    ncores: 4
    memory_mb: 2000
    base_keywords:
    - r2SCAN-3c
    neb_job: NEB-TS
- name: irc
  enabled: true
  engine: orca_nebts
  method: r2scan3c_orca_irc
  settings:
    allow_subprocess: false
    fallback_to_dummy: true
    ncores: 4
    memory_mb: 2000
    endpoint_rmsd_threshold_A: 0.75
- name: sp
  enabled: true
  engine: orca
  method: wb97xd4_def2_tzvppd_orca
  settings:
    allow_subprocess: false
    fallback_to_dummy: true
    ncores: 4
    memory_mb: 3000
    orca_keywords:
    - wB97X-D4
    - def2-TZVPPD
    - TightSCF
    - Grid5
    - FinalGrid6
- name: thermo
  enabled: true
  engine: goodvibes
  settings:
    apply_quasi_rrho: true
    frequency_scale_factor: 0.985
    low_freq_cutoff_cm1: 100.0
    quasi_rrho_alpha: 0.5
- name: descriptors
  enabled: true
- name: kinetics
  enabled: true
  engine: cantera
  tunneling_model: wigner
  export_arkane: true
  settings:
    residence_times_s:
    - 0.001
    - 0.01
    - 0.1
    - 1.0
- name: calibrate
  enabled: true
  reference_set_path: examples/reference_sets/hf_amine_gas_phase_demo.json
- name: rank
  enabled: true
- name: viz
  enabled: true
  settings:
    max_molecule_dossiers: 4
    max_reaction_dossiers: 4
    top_energy_profiles: 8
    max_network_reactions: 20
    library_mode: local
    asset_mode: local
    ranking_thumbnail_rows: 25
    max_chemiscope_structures: 200
