# Appends to an existing run (hfauto run method_panel ... --run-dir <run>): single points of
# the reaction stationary points at every panel method, then the panel report.
# ccsd-t_def2-tzvp is for small closed-shell molecules only; drop it for larger systems.
pipeline_id: method_panel
conditions: {temperatures_K: [298.15], standard_states: [1atm]}
stages:
  - {id: panel_sp, stage: sp, engine: nwchem, targets: reaction_stationary_points,
     methods: [pbe0-d3bj_def2-svp, pbe0-d3bj_def2-tzvp, wb97x-d3_def2-tzvpd, ccsd-t_def2-tzvp]}
  - {id: panel_report, stage: report}
