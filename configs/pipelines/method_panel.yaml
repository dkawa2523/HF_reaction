# Appends to an existing discover / known_endpoints run (hfauto run method_panel ...
# --run-dir <run>): single points of the stationary points at every panel method, then the
# panel report. The panel is shown, not ranked on: method_panel.csv gives dE_rxn and dE_act at
# every level, ranking.csv their dE_act min / max, and the ranking stays on the run's one
# energy layer (thermo energy_method, M06-2X-D3(0)/def2-TZVPD).
# Calibration of small molecules: add ccsd-t_def2-tzvpd to methods (HCN / HONO take seconds
# to minutes per point, CH3O. ROHF-CCSD(T) about 1 min on 4 ranks; five heavy atoms take about
# 23 min per point on 4 ranks at 2,000 MB per rank: malonaldehyde, 227 basis functions).
pipeline_id: method_panel
stages:
  - {id: panel_sp, stage: sp, engine: nwchem,
     methods: [pbe0-d3bj_def2-tzvpd, wb97x-d3_def2-tzvpd]}
  - {id: panel_report, stage: report}
