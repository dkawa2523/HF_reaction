run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001
  max_conformers_per_molecule: 5

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers:
      - dummy
      - name: pubchem
        network_enabled: false
  - name: detect-sites
    enabled: true
    max_sites_per_molecule: 5
  - name: conformers
    enabled: true
    engine: crest
    allow_subprocess: true   # If crest is unavailable, RDKit fallback is used and recorded.
    mode: auto
    gfn: 2
    quick: true
    max_conformers: 20
    selected_max: 5
    energy_window_kcal_mol: 8.0
    prune_rms_thresh: 0.5
    timeout_s: 7200
  - name: build-hf
    enabled: true
    hf_n: [1, 2]
  - name: preopt
    enabled: true
    engine: xtb
    method: gfn2-xtb
    update_species: true
    settings:
      allow_subprocess: true  # If xtb is unavailable, deterministic dummy fallback is used and recorded.
      mode: auto
      task: preopt
      gfn: 2
      opt: true
      opt_level: normal
      timeout_s: 3600
  - name: dft-minima
    enabled: true
    engine: dummy             # Replace with ORCA in Phase 4.
    method: r2scan3c-dummy
  - name: ts-search
    enabled: true
    engine: dummy
  - name: irc
    enabled: true
    engine: dummy
  - name: sp
    enabled: true
    engine: dummy
    method: wb97xd4-def2tzvppd-dummy
  - name: thermo
    enabled: true
  - name: descriptors
    enabled: true
  - name: kinetics
    enabled: true
    engine: dummy
  - name: rank
    enabled: true
