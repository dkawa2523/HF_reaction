run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers: [dummy]
  - name: detect-sites
    enabled: true
    max_sites_per_molecule: 5
  - name: conformers
    enabled: true
    engine: rdkit
    max_conformers: 4
    energy_window_kcal_mol: 6.0
  - name: build-hf
    enabled: true
    hf_n: [1, 2]
  - name: preopt
    enabled: true
    engine: dummy
    method: gfn2-xtb-dummy
  - name: dft-minima
    enabled: true
    engine: dummy
    method: r2scan3c-dummy
  - name: ts-search
    enabled: true
    engine: dummy
  - name: irc
    enabled: true
    engine: dummy
  - name: sp
    enabled: true
    engine: dummy
    method: wb97xd4-def2tzvppd-dummy
  - name: thermo
    enabled: true
    engine: dummy
  - name: descriptors
    enabled: true
  - name: kinetics
    enabled: true
    engine: dummy
  - name: rank
    enabled: true
