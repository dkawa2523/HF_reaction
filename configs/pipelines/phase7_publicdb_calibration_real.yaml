# Phase 7 production-style pipeline.
# Network/API-backed providers are opt-in and still cache all responses. Review
# provider license/API terms before enabling in production.
run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15, 473.15, 523.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001
  max_conformers_per_molecule: 5
  max_sites_per_molecule: 5

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers:
      - name: pubchem
        allow_network: true
        fetch_3d: true
        rate_limit_per_sec: 4
        cache_path: .hfauto_cache/pubchem.sqlite
      - name: nist_webbook
        allow_network: true
        rate_limit_per_sec: 2
      - name: atct
        allow_network: false
      - name: cccbdb
      - name: comptox
        allow_network: false  # set true only with EPA_CTX_API_KEY and endpoint config
      - name: niosh
      - name: cas_common_chemistry
  - name: detect-sites
    enabled: true
    max_sites_per_molecule: 5
  - name: conformers
    enabled: true
    engine: crest
    allow_subprocess: true
    fallback_to_rdkit: true
    executable: crest
    gfn: 2
    ncores: 8
    selected_max: 5
    max_conformers: 20
    timeout_s: 86400
  - name: build-hf
    enabled: true
    hf_n: [1, 2, 3]
  - name: preopt
    enabled: true
    engine: xtb
    method: gfn2-xtb
    allow_subprocess: true
    settings:
      executable: xtb
      gfn: 2
      opt_level: tight
      timeout_s: 7200
  - name: dft-minima
    enabled: true
    engine: orca
    method: r2scan3c_orca
    settings:
      executable: orca
      allow_subprocess: true
      fallback_to_dummy: false
      ncores: 16
      memory_mb: 4000
      timeout_s: 86400
      orca_keywords: ["r2SCAN-3c", "TightSCF", "TightOpt"]
  - name: ts-search
    enabled: true
    engine: orca_nebts
    method: orca_nebts_r2scan3c
    settings:
      executable: orca
      allow_subprocess: true
      fallback_to_dummy: false
      ncores: 16
      memory_mb: 4000
      timeout_s: 86400
      base_keywords: ["r2SCAN-3c"]
      neb_job: "NEB-TS"
      preopt_ends: true
      calc_hess: true
      mode_overlap_threshold: 0.7
  - name: irc
    enabled: true
    engine: orca_nebts
    method: orca_irc_r2scan3c
    settings:
      executable: orca
      allow_subprocess: true
      fallback_to_dummy: false
      ncores: 16
      memory_mb: 4000
      timeout_s: 86400
      base_keywords: ["r2SCAN-3c"]
      irc_maxiter: 100
      irc_step: 0.08
  - name: sp
    enabled: true
    engine: orca
    method: wb97xd4_def2_tzvppd_orca
    settings:
      executable: orca
      allow_subprocess: true
      fallback_to_dummy: false
      ncores: 16
      memory_mb: 4000
      timeout_s: 86400
      orca_keywords: ["wB97X-D4", "def2-TZVPPD", "TightSCF", "Grid5", "FinalGrid6"]
  - name: thermo
    enabled: true
    engine: goodvibes
    settings:
      apply_quasi_rrho: true
      frequency_scale_factor: 0.985
      low_freq_cutoff_cm1: 100.0
      quasi_rrho_alpha: 0.50
      thermo_model: goodvibes_or_internal_quasi_rrho
  - name: descriptors
    enabled: true
  - name: kinetics
    enabled: true
    engine: cantera
    tunneling_model: wigner
    export_arkane: true
    settings:
      residence_times_s: [0.001, 0.01, 0.1, 1.0]
  - name: method-validation
    enabled: true
  - name: rank
    enabled: true
