# Phase 3 production-style local pipeline.
# Requires `crest` and `xtb` on PATH, or provide explicit executable paths.
# You can also export HFAUTO_ALLOW_SUBPROCESS=1 instead of setting allow_subprocess.
run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15, 473.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001
  max_conformers_per_molecule: 5
  max_sites_per_molecule: 5

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers: [dummy]
  - name: detect-sites
    enabled: true
    max_sites_per_molecule: 5
  - name: conformers
    enabled: true
    engine: crest
    allow_subprocess: true
    fallback_to_rdkit: true
    executable: crest
    gfn: 2
    ncores: 8
    selected_max: 5
    max_conformers: 20
    timeout_s: 86400
  - name: build-hf
    enabled: true
    hf_n: [1, 2, 3]
  - name: preopt
    enabled: true
    engine: xtb
    method: gfn2-xtb
    allow_subprocess: true
    settings:
      executable: xtb
      gfn: 2
      opt_level: tight
      timeout_s: 7200
  - name: dft-minima
    enabled: true
    engine: dummy
    method: r2scan3c-dummy
  - name: thermo
    enabled: true
  - name: descriptors
    enabled: true
  - name: rank
    enabled: true
