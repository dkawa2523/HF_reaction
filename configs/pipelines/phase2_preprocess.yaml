# Phase 2: useful local/offline preprocessing and first-pass HF interaction ranking.
# It does not require ORCA/xTB or network access.
run_root: runs
input:
  sdf: examples/candidates.sdf

global:
  temperature_K: [298.15, 423.15, 473.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001

stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers: [dummy, pubchem, nist_webbook, comptox, niosh]
  - name: detect-sites
    enabled: true
    max_sites_per_molecule: 5
    min_site_confidence: 0.5
  - name: conformers
    enabled: true
    engine: rdkit
    max_conformers: 10
    energy_window_kcal_mol: 6.0
    prune_rms_thresh: 0.5
  - name: build-hf
    enabled: true
    hf_n: [1, 2, 3]
  - name: preopt
    enabled: true
    engine: dummy
    method: gfn2-xtb-proxy
  - name: dft-minima
    enabled: true
    engine: dummy
    method: r2scan3c-proxy
  - name: thermo
    enabled: true
  - name: descriptors
    enabled: true
  - name: rank
    enabled: true
