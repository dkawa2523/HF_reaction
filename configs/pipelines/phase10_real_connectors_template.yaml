# Production-style connector template. External tools are opt-in and require
# local installation plus reviewed project settings.
pipeline_id: phase10_real_connectors_template
input:
  sdf: examples/candidates.sdf
run_root: runs
global:
  temperature_K: [298.15, 423.15, 473.15]
  standard_pressure_bar: 1.0
  partial_pressures:
    HF: 0.01
    candidate: 0.001
stages:
  - name: ingest
    enabled: true
  - name: enrich
    enabled: true
    providers:
      - name: pubchem
        network_enabled: true
        fetch_3d: true
      - name: nist_webbook
        network_enabled: true
      - name: comptox
        network_enabled: true
        api_key_env: EPA_CTX_API_KEY
      - name: niosh
      - name: atct
      - name: cccbdb
  - name: detect-sites
    enabled: true
  - name: conformers
    enabled: true
    engine: crest
    allow_subprocess: true
    fallback_to_rdkit: true
  - name: build-hf
    enabled: true
    hf_n: [1, 2, 3]
  - name: preopt
    enabled: true
    engine: xtb
    allow_subprocess: true
  - name: dft-minima
    enabled: true
    engine: orca
    method: r2scan3c_orca
    settings:
      allow_subprocess: true
      fallback_to_dummy: false
  - name: ts-search
    enabled: true
    engine: orca_nebts
    settings:
      allow_subprocess: true
      fallback_to_dummy: false
  - name: irc
    enabled: true
    engine: orca_nebts
    settings:
      allow_subprocess: true
      fallback_to_dummy: false
  - name: sp
    enabled: true
    engine: orca
    method: wb97xd4_def2_tzvppd_orca
    settings:
      allow_subprocess: true
      fallback_to_dummy: false
  - name: thermo
    enabled: true
    engine: goodvibes
    settings:
      use_external_goodvibes: true
      allow_subprocess: true
      executable: goodvibes
      extra_args: []
      apply_internal_quasi_rrho: true
      prefer_external_goodvibes_g: true
  - name: kinetics
    enabled: true
    engine: tst
    tunneling_model: wigner
    cantera:
      allow_external: true
      run_reactor: true
      residence_times_s: [0.001, 0.01, 0.1, 1.0]
    arkane:
      run_external: false
      allow_subprocess: false
      # production_input: path/to/reviewed_arkane_input.py
    write_arkane_skeleton: true
  - name: calibrate
    enabled: true
  - name: connector-audit
    enabled: true
  - name: rank
    enabled: true
  - name: viz
    enabled: true
    settings:
      library_mode: local
  - name: ops
    enabled: true
