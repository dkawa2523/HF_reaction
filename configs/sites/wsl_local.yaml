# WSL2 Ubuntu on the workstation (.wslconfig: 4 vCPU / 11 GB). The only config layer with
# absolute paths. Scratch must stay on ext4 under $HOME (never /mnt/c, never /tmp).
# With .wslconfig raised to 16 vCPU / 48 GB: cores 16, nwchem ranks 16 x memory_mb_per_rank
# 2000 (32 GB <= 0.8 x MemTotal), crest threads 4 (4 jobs at once).
site: wsl_local
scratch_root: /home/user/hfauto_scratch
cores: 4
engines:
  nwchem: &nwchem
    version: "7.2.3"
    executables:
      nwchem: /home/user/.local/bin/nwchem
      mpirun: /home/user/.local/opt/nwchem-7.2.3/bin/mpirun
    scratch_dir: /home/user/hfauto_scratch/nwchem
    # ranks x memory_mb_per_rank <= 0.8 x MemTotal: 4 x 2000 MB = 8 GB <= 0.8 x 11 GB
    execution: {ranks: 4, memory_mb_per_rank: 2000, timeout_s: 14400}
  nwchem_saddle: *nwchem
  nwchem_string: *nwchem
  xtb:
    version: "6.7.1"
    executables: {xtb: /home/user/.local/bin/xtb}
    execution: {threads: 1}
  pysis_neb:
    version: "6.7.1"  # the xTB version behind the native calculator
    executables: {xtb: /home/user/.local/bin/xtb}
    python: /home/user/.venvs/hfauto-prod/bin/python
  crest:
    version: "3.0.2"
    executables: {crest: /home/user/.local/bin/crest}
    execution: {threads: 4}
  readuct:
    version: "6.1.0"
    python: /home/user/.venvs/hfauto-prod/bin/python
