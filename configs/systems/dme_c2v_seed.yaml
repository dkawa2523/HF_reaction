# The S12 DME double methyl rotation (degenerate, within 0.05 of S12) plus an exactly C2v DME
# with both methyls eclipsed (monomer species): the second-order saddle of the two rotations (-232i
# and -130i in the W1 DFT probe). Only its minima-stage branch is judged. Fake-pass checks: two
# imaginary modes before the follow; follow1 moves to one side and ends in the DME minimum.
system_id: dme_c2v_seed
species:
  - {id: dme_a, xyz: xyz/dme_rough/reactant.xyz, role: endpoint}
  - {id: dme_b, xyz: xyz/dme_rough/product.xyz, role: endpoint}
  - {id: dme_c2v, xyz: xyz/dme_c2v_seed/c2v_eclipsed.xyz}
reactions:
  - {id: dme_double_rotation, reactant: dme_a, product: dme_b}
