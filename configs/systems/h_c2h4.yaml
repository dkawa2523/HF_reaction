# M8 counter-example of the association scan (analysis X4-2): H. + C2H4 -> C2H5. (doublet).
# One open-shell component, so not low-spin coupled: UKS stays a clean doublet along the scan.
# The addition has a small barrier, 1.72 kcal/mol (W1, NHTBH38: Zhao, Gonzalez-Garcia, Truhlar,
# JPCA 109, 2012 (2005)); hybrid functionals underestimate it. Expected: the relaxed C0-H6 scan
# from the separated monomers has a maximum and the case goes on to a saddle search. A PBE0
# maximum below resolution_kcal is recorded as barrierless_at_resolution, not tuned away.
# Fake-pass checks: the reactant end is H + C2H4 apart, not the complex; the scan starts at the
# adduct C0-H6 + 1.5 A or beyond. Runs with known_endpoints (declared) or discover (composition).
system_id: h_c2h4
species:
  - {id: h, smiles: "[H]", multiplicity: 2}
  - {id: c2h4, smiles: "C=C", multiplicity: 1}
  - {id: complex, xyz: xyz/h_c2h4_complex.xyz, multiplicity: 2, role: endpoint}
  - {id: adduct, xyz: xyz/h_c2h4_adduct.xyz, multiplicity: 2, role: endpoint}
compositions:
  - {id: h_c2h4, components: {h: 1, c2h4: 1}}
reactions:
  - {id: h_c2h4_addition, reactant: complex, product: adduct}
