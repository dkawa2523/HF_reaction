# H2O...HF is pyramidal at O (about 46 deg; 45.5 deg and lowest freq 225 cm-1 in the W1 DFT
# probe) and inverts over about 0.4 kcal/mol (Kisiel 1982), below the 1.0 kcal/mol resolution:
# expected barrierless_at_resolution (screen:barrierless after 2 midpoint SPs), no saddle job,
# dG_eff 0. Fake-pass checks: both minima pyramidal (> 20 deg); the reason is not well_is_endpoint.
system_id: h2o_hf_inversion
species:
  - {id: h2o_hf_plus, xyz: xyz/h2o_hf_inversion/plus.xyz, role: endpoint}
  - {id: h2o_hf_minus, xyz: xyz/h2o_hf_inversion/minus.xyz, role: endpoint}
reactions:
  - {id: h2o_hf_inversion, reactant: h2o_hf_plus, product: h2o_hf_minus}
