# the atomic guess its SCF fails on the open-shell H···C2H4 complex on both ladder rungs.
id: m06-2x-d3_def2-tzvpd
kind: dft
functional: m06-2x
basis: def2-tzvpd
dispersion: d3zero
grid: fine
scf_energy_tol: 1.0e-7
