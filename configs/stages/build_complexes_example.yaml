# Illustrative stage config. Replace selectors and zero-based atom indices.
systems:
  - system_id: candidate_reagent_reactant
    state: reactant_complex
    phase: gas
    charge: 0
    multiplicity: 1
    atom_order_key: candidate_reagent_path_01
    environment: {model: isolated_cluster}
    fragments:
      - component_id: candidate
        role: candidate
        source: {artifact_type: conformer, conformer_id: mol00001_conf0000}
      - component_id: reagent
        role: reagent
        source: {artifact_type: conformer, conformer_id: mol00002_conf0000}
        placement:
          host_component_id: candidate
          host_atom_index: 0
          guest_atom_index: 0
          distance_A: 2.0
          direction: [1.0, 0.0, 0.0]
          min_interfragment_distance_A: 0.65

  # The product source must already use the same symbols and atom order.
  - system_id: candidate_reagent_product
    state: product_complex
    phase: gas
    charge: 0
    multiplicity: 1
    atom_order_key: candidate_reagent_path_01
    fragments:
      - component_id: mapped_product
        role: product
        source: {artifact_id: mapped_product_conf0000}
