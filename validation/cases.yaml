# Validation cases: one run each, the pipeline chain that makes it and what it must conclude
# (model and comparison: hfauto/reporting/validation.py; tools: check.py, replay.py; record:
# docs/validation.md).
#
# chain        the pipelines run in turn in one run dir (later ones resume it). A name is a file
#              under configs/pipelines or configs/systems, a path is relative to the repository.
# reactions    every reaction with an outcome: the equation of its end fragments (fragment
#              formulas of the optimized end minima; an association starts from its separated
#              monomers), the outcome and dG_eff in kcal/mol at (T_K, standard_state): a value
#              within `tolerance`, a [low, high] band, or null for no ranking value.
# minima       fragment formulas of minima the run holds (runs that stop before reactions).
# refusals     reason categories of refused records.  products: discovery products.
# bh76         the reference row of validation/bh76/subset.yaml (<reaction>.<direction>). An
#              outcome without a barrier against a referenced row is a deviation, never a pass;
#              the numeric comparison (electronic barriers, never dG_eff) is a separate table.
# twice        a boundary system: a fresh validation runs it twice (<name> and <name>.2).
# superseded   evidence only: no new run is made; the text names what replaces it.
#
# Expectations: the VAL9/R2 records (docs/validation.md §3, /home/user/hfauto_r9/VAL9/R2) with the
# changes recorded in docs/validation.md §11 (W3: a barrierless step has no dG_eff), the
# tolerance 0.01 kcal/mol of docs/validation.md §3. Not cases: s9_undeclared and s9_conformers
# (transition-metal DFT is unvalidated; a species without a multiplicity is now refused when the
# system file loads).

hcn:
  chain: [{pipeline: known_endpoints, system: hcn}]
  reactions:
    - {equation: CHN -> CHN, outcome: elementary_step, dG_eff: 41.57, bh76: hcn_hnc.forward}

hono:
  chain: [{pipeline: known_endpoints, system: hono}]
  reactions:
