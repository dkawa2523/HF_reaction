s20_sn2_panel:
  T_K: 400
  standard_state: 1M
  chain:
    - {pipeline: known_endpoints, system: sn2_cl}
    - {pipeline: validation/inputs/pipelines/panel_conditions.yaml, system: sn2_cl}
  reactions:
    - {equation: CH3Cl + Cl -> CH3Cl + Cl, outcome: degenerate_rearrangement, dG_eff: 14.89}

s20_hcn_panel:
  chain:
    - {pipeline: known_endpoints, system: hcn}
    - {pipeline: validation/inputs/pipelines/panel_ccsdt.yaml, system: hcn}
  reactions:
    - {equation: CHN -> CHN, outcome: elementary_step, dG_eff: 41.57}

s20_ch3o_panel:
  chain:
    - {pipeline: known_endpoints, system: ch3o_doublet}
    - {pipeline: validation/inputs/pipelines/panel_ccsdt.yaml, system: ch3o_doublet}
  reactions:
    - {equation: CH3O -> CH3O, outcome: elementary_step, dG_eff: 30.26}

hono_panel:
  chain:
    - {pipeline: known_endpoints, system: hono}
    - {pipeline: validation/inputs/pipelines/panel_ccsdt.yaml, system: hono}
  reactions:
    - {equation: HNO2 -> HNO2, outcome: elementary_step, dG_eff: 9.88}

s10_amine_pilot2:
  chain: [{pipeline: discover, system: amine_pilot2}]
  reactions:
    - {equation: FH + H3N -> FH + H3N, outcome: degenerate_rearrangement, dG_eff: 36.64}

s19_tma_hf2:
  chain: [{pipeline: discover, system: tma_hf2}]
  reactions:
    - {equation: C3H10FN + FH -> C3H10FN + FH, outcome: same_basin, dG_eff: null}

s5_ch3_o2:
  twice: true  # split2 (CH2OOH -> CH2O + OH) ends near the boundary
  chain: [{pipeline: discover, system: ch3_o2}]
  reactions:
    - {equation: CH3 + O2 -> CH3O2, outcome: barrierless_at_resolution, dG_eff: null}
    - {equation: CH3O2 -> CH2O + HO, outcome: multi_step, dG_eff: null}
    - {equation: CH3O2 -> CH3O2, outcome: elementary_step, dG_eff: 46.85}  # split1
    # split2: the mass-weighted χ accepts its O-O cleavage saddle (W2; fresh W2/s5, M06-2X dE‡
    # 1.93). A replay of the R2 path (B1) stays unresolved_within_budget (docs/validation.md §11.2)
    - {equation: CH3O2 -> CH2O + HO, outcome: elementary_step, dG_eff: 0.13}

s6_oh_ch4:
  twice: true  # the near-Cs TS is Cs or C1 by run: dG_eff moves by RT ln 2
  chain: [{pipeline: discover, system: oh_ch4}]
  reactions:
    # W3: zero at the separated OH + CH4 (10.39 at a C1 TS, 9.98 at Cs; complex zero 5.53/5.95)
    - {equation: CH4 + HO -> CH3 + H2O, outcome: elementary_step, dG_eff: [9.95, 10.45],
       bh76: oh_ch4.forward}
    # W4 (docs/validation.md §11.4): the low-level edges reach the DFT entry one by one, so the
    # CH3OH + H channel is its own step from CH3 + H2O (VAL9's CH4 + HO -> CH4O + H parent and
    # its two children are gone; the abstraction's reverse is the same case key)
    - {equation: CH3 + H2O -> CH4O + H, outcome: elementary_step, dG_eff: 54.62}
    - {equation: CH4O + H -> CH3O + H2, outcome: elementary_step, dG_eff: 13.1}
    - {equation: CH2 + H + H2O -> CH4O + H, outcome: barrierless_at_resolution, dG_eff: null}
