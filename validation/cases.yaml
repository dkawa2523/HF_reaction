    - {equation: C2H2O4 -> C2H2O4, outcome: elementary_step, dG_eff: 11.81}  # split1
    - {equation: C2H2O4 -> C2H2O4, outcome: elementary_step, dG_eff: 12.71}  # split2

malonaldehyde_c2v_undeclared:
  chain:
    - {pipeline: known_endpoints,
       system: validation/inputs/systems/malonaldehyde_c2v_undeclared.yaml}
  reactions:
