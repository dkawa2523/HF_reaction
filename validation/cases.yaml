hono_walltime:
  superseded: >-
    budgets are counts; a wall-clock stop is external (SIGTERM): the stage is left incomplete
    (rc 1) and a resume finishes it. Replaced by the fake-engine tests
    tests/integration/test_resume_e2e.py::test_sigterm_leaves_the_stage_incomplete_and_a_rerun_resumes_it
    and tests/integration/test_reaction_paths_stage.py::test_a_split_child_queued_behind_a_sibling_that_used_its_budget_has_its_own
  chain:
    - {pipeline: /home/user/hfauto_r9/pipelines/known_endpoints_walltime.yaml, system: hono}
  reactions:
    - {equation: HNO2 -> HNO2, outcome: unresolved_within_budget, dG_eff: null}

