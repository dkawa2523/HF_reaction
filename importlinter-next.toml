# Import contracts for the modules written in Waves 2-4 (docs/current/refactor_design.md, 11.1).
# Run: lint-imports --config importlinter-next.toml
# Wave 4 widens the sources; Wave 6 moves the final contracts to pyproject and deletes this file.

[tool.importlinter]
root_packages = ["hfauto"]

[[tool.importlinter.contracts]]
id = "next-core"
name = "new core modules import nothing above core"
type = "forbidden"
source_modules = [
  "hfauto.core.evidence",
  "hfauto.core.records",
  "hfauto.core.manifest",
  "hfauto.core.method",
  "hfauto.core.system",
]
forbidden_modules = [
  "hfauto.chemistry",
  "hfauto.backends",
  "hfauto.execution",
  "hfauto.drivers",
  "hfauto.stages",
  "hfauto.pipeline",
  "hfauto.workflow",
  "hfauto.core.schemas",
  "hfauto.core.io",
  "hfauto.core.artifacts",
]

[[tool.importlinter.contracts]]
id = "next-chemistry"
name = "Wave 2-4 chemistry modules stay pure"
type = "forbidden"
source_modules = [
  "hfauto.chemistry.gates",
  "hfauto.chemistry.hypotheses",
  "hfauto.chemistry.classification",
  "hfauto.chemistry.identity",
  "hfauto.chemistry.interpolation",
  "hfauto.chemistry.modes",
  "hfauto.chemistry.placement",
  "hfauto.chemistry.profile",
  "hfauto.chemistry.selection",
  "hfauto.chemistry.smiles",
  "hfauto.chemistry.thermo",
  "hfauto.chemistry.topology",
  "hfauto.chemistry.trials",
  "hfauto.chemistry.vibrations",
  "hfauto.chemistry.xyz",
]
forbidden_modules = [
  "hfauto.execution",
  "hfauto.backends",
  "hfauto.drivers",
  "hfauto.stages",
  "hfauto.pipeline",
  "hfauto.workflow",
  "hfauto.core.schemas",
]

[[tool.importlinter.contracts]]
id = "next-execution"
name = "execution depends only on core"
type = "forbidden"
source_modules = ["hfauto.execution"]
forbidden_modules = [
  "hfauto.backends",
  "hfauto.chemistry",
  "hfauto.drivers",
  "hfauto.stages",
  "hfauto.pipeline",
  "hfauto.workflow",
]

[[tool.importlinter.contracts]]
id = "next-protocols-only"
name = "drivers, new stages and the new reporting see engines only through backends.protocols"
type = "forbidden"
source_modules = [
  "hfauto.drivers",
  "hfauto.reporting.summary",
  "hfauto.reporting.html",
  "hfauto.stages.spec",
  "hfauto.stages.catalog",
  "hfauto.stages.structures",
  "hfauto.stages.conformer_search",
  "hfauto.stages.minima",
  "hfauto.stages.explore",
  "hfauto.stages.reaction_paths",
  "hfauto.stages.single_point",
  "hfauto.stages.thermochemistry",
  "hfauto.stages.report",
]
forbidden_modules = [
  "hfauto.backends.engines",
  "hfauto.backends.nwchem",
  "hfauto.backends.xtb",
  "hfauto.backends.pysis",
  "hfauto.backends.crest",
  "hfauto.backends.readuct",
  "hfauto.backends.goodvibes",
  "hfauto.execution",
  "hfauto.pipeline",
  "hfauto.workflow",
]
# backends.protocols names JobRunner under TYPE_CHECKING (design 6.1), which import-linter
# counts; only direct imports from these sources are forbidden.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
id = "next-adapters-independent"
name = "engine adapters do not import each other"
type = "independence"
modules = [
  "hfauto.backends.nwchem",
  "hfauto.backends.xtb",
  "hfauto.backends.pysis",
  "hfauto.backends.crest",
  "hfauto.backends.readuct",
  "hfauto.backends.goodvibes",
]

[[tool.importlinter.contracts]]
id = "next-pipeline"
name = "pipeline does not use the legacy workflow, schemas, config or stage registry"
type = "forbidden"
source_modules = ["hfauto.pipeline"]
forbidden_modules = [
  "hfauto.workflow",
  "hfauto.core.schemas",
  "hfauto.core.config",
  "hfauto.stages.registry",
  "hfauto.stages.base",
]
